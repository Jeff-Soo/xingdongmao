{% extends "base.html" %}
{% load i18n %}

{% block title %}登录 - Pattern{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <h1 class="text-2xl font-bold mb-6">登录</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full btn-accent text-white py-2 rounded-lg hover:btn-accent">
            登录
        </button>
    </form>
    <p class="mt-4 text-center text-gray-500">
        还没有账号？<a href="{% url 'account_signup' %}" class="text-accent">注册</a>
    </p>
</div>
{% endblock %}
