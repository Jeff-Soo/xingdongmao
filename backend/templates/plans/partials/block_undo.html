<div id="block-card-{{ block.pk }}" class="rounded-xl border border-muted px-4 py-3 theme-card border-l-4">
    <div class="flex items-center gap-3">
        <div class="flex-1">
            <span class="font-medium editable-task"
                  hx-get="{% url 'plans:inline_edit_block' block.pk %}?field=action"
                  hx-trigger="click" hx-target="this" hx-swap="outerHTML"
                  title="点击编辑任务">{{ block.action }}</span>
        </div>
        <button type="button"
                hx-post="{% url 'plans:complete_block' block.pk %}"
                hx-target="#block-card-{{ block.pk }}"
                hx-swap="outerHTML"
                class="w-8 h-8 rounded-full border-2 text-accent flex items-center justify-center flex-shrink-0">✓</button>
    </div>
    <div class="flex items-center gap-2 mt-1.5">
        <span class="editable-time text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full"
              hx-get="{% url 'plans:inline_edit_block' block.pk %}?field=start_time"
              hx-trigger="click" hx-target="this" hx-swap="outerHTML"
              title="点击编辑开始时间">≈ {{ block.start_time|time:"H:i" }}</span>
        <span class="text-xs text-gray-300">—</span>
        <span class="editable-time text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full"
              hx-get="{% url 'plans:inline_edit_block' block.pk %}?field=end_time"
              hx-trigger="click" hx-target="this" hx-swap="outerHTML"
              title="点击编辑结束时间">≈ {{ block.end_time|time:"H:i" }}</span>
        <span class="text-xs text-gray-400 ml-auto">{{ block.plan.title }}</span>
    </div>
</div>
