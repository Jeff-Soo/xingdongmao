<input type="text" name="value" value="{{ current }}"
       hx-post="{% url 'plans:inline_edit_block' block.pk %}"
       hx-trigger="change, keydown[key=='Enter']"
       hx-target="this"
       hx-swap="outerHTML"
       hx-vals='{"field": "{{ field }}"}'
       class="border rounded px-2 py-0.5 text-sm w-56"
       autofocus>
